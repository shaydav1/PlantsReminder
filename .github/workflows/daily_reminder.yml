name: Daily Plant Reminder

on:
  schedule:
    # ירוץ בכל יום בשעה 05:00 UTC (08:00 בבוקר שעון ישראל)
    - cron: '0 5 * * *'
  workflow_dispatch: # מאפשר הרצה ידנית בלחיצת כפתור

jobs:
  run-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create Credentials Files from Secrets
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GCP_TOKEN: ${{ secrets.GCP_TOKEN }}
        run: |
          echo "$GCP_CREDENTIALS" > credentials.json
          echo "$GCP_TOKEN" > token.json

      - name: Run Plant Reminder
        run: python main.py

      - name: Clean sensitive files
        if: always()
        run: |
          rm -f credentials.json token.json